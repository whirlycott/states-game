<!DOCTYPE html>
<html>
<head>
    <title>SVG Debug</title>
    <style>
        body { padding: 20px; font-family: Arial, sans-serif; }
        #debug { background: #f0f0f0; padding: 20px; margin: 20px 0; }
        svg { border: 1px solid #ccc; max-width: 100%; height: 400px; }
    </style>
</head>
<body>
    <h1>SVG Debug Test</h1>
    <div id="debug">Debug info will appear here...</div>
    <div id="map-container"></div>
    
    <script>
        async function loadAndDebugSVG() {
            const debugDiv = document.getElementById('debug');
            
            try {
                debugDiv.innerHTML += 'Loading SVG...<br>';
                
                const response = await fetch('Usa_and_Canada_with_names_natural.svg');
                debugDiv.innerHTML += `SVG fetch status: ${response.status}<br>`;
                
                if (!response.ok) {
                    debugDiv.innerHTML += `Error: ${response.statusText}<br>`;
                    return;
                }
                
                const svgText = await response.text();
                debugDiv.innerHTML += `SVG text length: ${svgText.length}<br>`;
                
                const mapContainer = document.getElementById('map-container');
                mapContainer.innerHTML = svgText;
                
                const svgElement = mapContainer.querySelector('svg');
                debugDiv.innerHTML += `SVG element found: ${!!svgElement}<br>`;
                
                if (svgElement) {
                    const usStates = svgElement.querySelectorAll('[id^="US-"]');
                    const caProvinces = svgElement.querySelectorAll('[id^="CA-"]');
                    
                    debugDiv.innerHTML += `US states found: ${usStates.length}<br>`;
                    debugDiv.innerHTML += `CA provinces found: ${caProvinces.length}<br>`;
                    
                    // List first few states
                    debugDiv.innerHTML += 'First 5 US states:<br>';
                    for (let i = 0; i < Math.min(5, usStates.length); i++) {
                        debugDiv.innerHTML += `- ${usStates[i].id}<br>`;
                    }
                    
                    // Hide text labels to prevent cheating
                    const allText = svgElement.querySelectorAll('text');
                    allText.forEach(text => {
                        text.style.display = 'none';
                    });
                    debugDiv.innerHTML += `Text labels hidden: ${allText.length}<br>`;
                    
                    // Try to highlight one state
                    const alabama = svgElement.querySelector('#US-AL');
                    if (alabama) {
                        alabama.style.fill = 'red';
                        alabama.style.stroke = 'darkred';
                        alabama.style.strokeWidth = '2';
                        debugDiv.innerHTML += 'Alabama highlighted in red<br>';
                    } else {
                        debugDiv.innerHTML += 'Could not find Alabama (US-AL)<br>';
                    }
                }
                
            } catch (error) {
                debugDiv.innerHTML += `Error: ${error.message}<br>`;
                console.error('SVG loading error:', error);
            }
        }
        
        loadAndDebugSVG();
    </script>
</body>
</html>
